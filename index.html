/* TAB BUTTONS */

.app-nav button{
    margin:0;

}

}

/* NORMAL CALCULATOR */

.calc-card{
    display:none;
    background:white;
    padding:18px;
    border-radius:14px;
    box-shadow:0 3px 12px #0002;
}

.calc-display{
    width:100%;
    padding:16px;
    border:1px solid #bbb;
    border-radius:10px;
    font-size:28px;
    text-align:right;
    background:#f7f7f7;
    margin-bottom:12px;
}

.calc-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
}

.calc-grid button{
    margin:0;
    padding:16px 8px;
    font-size:20px;
    background:#eef3f7;

}

.calc-grid button.op{
    background:#075b91;
    color:white;
}

.calc-grid button.equal{
    background:#168c45;
    color:white;
}

.calc-grid button.wide{
    grid-column:span 2;
}

/* FIXED FOOTER */

.footer{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#000;
    color:#fff;
    text-align:center;
    padding:14px 10px;
    font-size:14px;
    font-weight:bold;

    box-shadow:0 -2px 8px #0005;

</style>

<body>

<script>


/* =========================
   NORMAL CALCULATOR
========================= */

let calcExpr = "";


function showTab(tab){

    const emi =
        document.getElementById("emiCalc");

    const normal =
        document.getElementById("normalCalc");

    const emiTab =
        document.getElementById("emiTab");

    const normalTab =
        document.getElementById("normalTab");


    if(tab === "normal"){

        emi.style.display = "none";

        normal.style.display = "block";

        emiTab.classList.remove("active");

        normalTab.classList.add("active");

    }else{

        emi.style.display = "block";

        normal.style.display = "none";

        normalTab.classList.remove("active");

        emiTab.classList.add("active");

    }

}


function calcInput(value){

    if(calcExpr === "Error"){

        calcExpr = "";

    }

    calcExpr += value;

    document.getElementById("calcDisplay").value =
        calcExpr || "0";

}


function calcClear(){

    calcExpr = "";

    document.getElementById("calcDisplay").value =
        "0";

}


function calcBack(){

    if(calcExpr === "Error"){

        return calcClear();

    }

    calcExpr =
        calcExpr.slice(0,-1);

    document.getElementById("calcDisplay").value =
        calcExpr || "0";

}


function calcEquals(){

    try{

        if(!calcExpr){

            return;

        }

        let expression =
            calcExpr.replace(/%/g,"/100");


        if(
            !/^[0-9+\-*/().\s]+$/.test(expression)
        ){

            throw new Error();

        }


        const result =
            Function(
                '"use strict"; return (' +
                expression +
                ')'
            )();


        if(!Number.isFinite(result)){

            throw new Error();

        }


        calcExpr =
            String(
                Math.round(
                    (result + Number.EPSILON) *
                    100000000
                ) / 100000000
            );


        document.getElementById(
            "calcDisplay"
        ).value =
            calcExpr;


    }catch(e){

        calcExpr = "Error";

        document.getElementById(
            "calcDisplay"
        ).value =
            "Error";

    }

}


/* =========================
   SCHEME DATA
========================= */

const schemes = {


    "7/1":{

        dbd:0.035,

        roi:0.057,

        adv:1,

        tenure:7,

        payEmi:6,

        min:14500

    },


    "8/0":{

        dbd:0.03,

        roi:0.112,

        adv:0,

        tenure:8,

        payEmi:8,

        min:12700

    },


    "10/2":{

        dbd:0.02,

        roi:0.0753,

        adv:2,

        tenure:10,

        payEmi:8,

        min:17200

    },


    "15/3":{

        dbd:0.03,

        roi:0.0713,

        adv:3,

        tenure:15,

        payEmi:12,

        min:12200

    },


    "12/4":{

        dbd:0.02,

        roi:0.048,

        adv:4,

        tenure:12,

        payEmi:8,

        min:19500

    },


    "18/6":{

        dbd:0.02,

        roi:0.0525,

        adv:6,

        tenure:18,

        payEmi:12,

        min:16100

    },


    "24/4":{

        dbd:0.02,

        roi:0.093,

        adv:4,

        tenure:24,

        payEmi:20,

        min:12000

    },


    "20/2":{

        dbd:0.02,

        roi:0.1105,

        adv:2,

        tenure:20,

        payEmi:18,

        min:12000

    },


    "18/4":{

        dbd:0.02,

        roi:0.077,

        adv:4,

        tenure:18,

        payEmi:14,

        min:13300

    },


    "10/0":{

        dbd:0.05,

        roi:0.0918,

        adv:0,

        tenure:10,

        payEmi:10,

        min:12000

    },


    "12/1":{

        dbd:0.03,

        roi:0.098,

        adv:1,

        tenure:12,

        payEmi:11,

        min:12000

    }

};


/* =========================
   MONEY FORMAT
========================= */

function money(n){

    return "₹" +
        Math.round(n)
        .toLocaleString("en-IN");

}


/* =========================
   EMI CALCULATION
========================= */

function calculate(){

    const amount =
        Number(
            document.getElementById(
                "amount"
            ).value
        ) || 0;


    const customer =
        document.getElementById(
            "customer"
        ).value;


    const schemeName =
        document.getElementById(
            "scheme"
        ).value;


    const insurance =
        Number(
            document.getElementById(
                "insurance"
            ).value
        ) || 0;


    const s =
        schemes[schemeName];


    /* EMPTY AMOUNT */

    if(amount <= 0){

        document.getElementById(
            "product"
        ).innerText = "₹0";

        document.getElementById(
            "process"
        ).innerText = "₹0";

        document.getElementById(
            "dbd"
        ).innerText = "₹0";

        document.getElementById(
            "dp"
        ).innerText = "₹0";

        document.getElementById(
            "disbursement"
        ).innerText = "₹0";

        document.getElementById(
            "insuranceValue"
        ).innerText = "₹0";

        document.getElementById(
            "finalEmi"
        ).innerText = "₹0";

        document.getElementById(
            "months"
        ).innerText =
            "× 0 Pay EMIs";

        document.getElementById(
            "message"
        ).innerText = "";

        return;

    }


    /* MINIMUM LOAN WARNING */

    const warning =
        document.getElementById(
            "warning"
        );


    if(amount < s.min){

        warning.innerText =
            "Minimum loan amount for " +
            schemeName +
            " is " +
            money(s.min);

    }else{

        warning.innerText = "";

    }


    /* PROCESS AMOUNT */

    const process =
        Math.round(

            amount /
            (
                1 -
                s.dbd -
                (s.dbd * 0.18)
            )

        );


    /* DBD */

    const dbd =
        Math.round(
            process * s.dbd
        );


    /* GST */

    const gst =
        Math.round(
            dbd * 0.18
        );


    const totalDbdGst =
        dbd + gst;


    /* BASE EMI */

    const baseEmi =
        Math.round(

            process / s.tenure

            +

            (
                process *
                s.roi /
                12
            )

        );


    /* DP */

    let dp;


    if(s.adv === 0){

        if(
            customer ===
            "NEW CUSTOMER"
        ){

            dp = 1417;

        }else{

            dp = 837;

        }

    }else{

        dp =
            Math.round(
                s.adv *
                baseEmi +
                567
            );

    }


    /* DISBURSEMENT */

    const disbursement =
        Math.round(

            process -
            totalDbdGst -
            dp

        );


    /* INSURANCE */

    const insurancePerEmi =
        Math.round(

            insurance /
            s.payEmi

        );


    /* FINAL EMI */

    const finalEmi =
        baseEmi +
        insurancePerEmi;


    /* DISPLAY */

    document.getElementById(
        "product"
    ).innerText =
        money(amount);


    document.getElementById(
        "process"
    ).innerText =
        money(process);


    document.getElementById(
        "dbd"
    ).innerText =
        money(totalDbdGst);


    document.getElementById(
        "dp"
    ).innerText =
        money(dp);


    document.getElementById(
        "disbursement"
    ).innerText =
        money(disbursement);


    document.getElementById(
        "insuranceValue"
    ).innerText =
        money(insurance);


    document.getElementById(
        "finalEmi"
    ).innerText =
        money(finalEmi);


    document.getElementById(
        "months"
    ).innerText =
        "× " +
        s.payEmi +
        " Pay EMIs";


    /* =========================
       EMI QUOTATION
       NO EMOJIS
    ========================= */

    const message =

`────────────────────
EMI QUOTATION
────────────────────

Shop Amount: ${money(amount)}
Customer Type: ${customer}
Scheme: ${schemeName}

Product Amount: ${money(amount)}
Process Amount: ${money(process)}
DBD + GST: ${money(totalDbdGst)}
DP: ${money(dp)}
Disbursement: ${money(disbursement)}
Insurance: ${money(insurance)}

FINAL EMI: ${money(finalEmi)}
Pay EMIs: ${s.payEmi} Months

────────────────────
Easy EMI — EMI in Just a Sec`;


    document.getElementById(
        "message"
    ).innerText =
        message;

}


/* =========================
   COPY QUOTATION
========================= */

function copyMessage(){

    const text =
        document.getElementById(
            "message"
        ).innerText;


    if(!text){

        alert(
            "Please enter Shop Amount"
        );

        return;

    }


    if(
        navigator.clipboard &&
        navigator.clipboard.writeText
    ){

        navigator.clipboard
        .writeText(text)
        .then(function(){

            alert(
                "EMI quotation copied"
            );

        })
        .catch(function(){

            alert(
                "Copy failed"
            );

        });

    }else{

        alert(
            "Copy is not available"
        );

    }

}


/* =========================
   WHATSAPP
========================= */

function sendWhatsApp(){

    const text =
        document.getElementById(
            "message"
        ).innerText;


    if(!text){

        alert(
            "Please enter Shop Amount"
        );

        return;

    }


    const url =
        "https://wa.me/?text=" +
        encodeURIComponent(text);


    window.open(
        url,
        "_blank"
    );

}


/* =========================
   PAGE LOAD
========================= */

window.onload = function(){

    calculate();

};

</script>
