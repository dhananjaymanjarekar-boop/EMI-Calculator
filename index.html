<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bajaj EMI Calculator</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#f2f5f8;
    color:#17212b;
}

.container{
    max-width:520px;
    margin:auto;
    padding:15px;
}

.header{
    background:#075b91;
    color:white;
    padding:20px;
    border-radius:14px 14px 0 0;
    text-align:center;
}

.header h1{
    margin:0;
    font-size:23px;
}

.card{
    background:white;
    padding:18px;
    border-radius:0 0 14px 14px;
    box-shadow:0 3px 12px #0002;
}

label{
    display:block;
    font-weight:bold;
    margin-top:14px;
    margin-bottom:6px;
}

input,select{
    width:100%;
    padding:13px;
    border:1px solid #bbb;
    border-radius:9px;
    font-size:17px;
    background:white;
}

.result{
    margin-top:20px;
    background:#eef8ff;
    border-radius:12px;
    padding:15px;
}

.row{
    display:flex;
    justify-content:space-between;
    padding:9px 0;
    border-bottom:1px solid #d7e4ed;
    gap:10px;
}

.row:last-child{
    border-bottom:0;
}

.value{
    font-weight:bold;
}

.final{
    margin-top:12px;
    padding:15px;
    background:#075b91;
    color:white;
    border-radius:10px;
    text-align:center;
}

.final .emi{
    font-size:27px;
    font-weight:bold;
}

.info{
    margin-top:8px;
    font-size:13px;
}

button{
    width:100%;
    margin-top:15px;
    padding:14px;
    border:0;
    border-radius:9px;
    font-size:17px;
    font-weight:bold;
    cursor:pointer;
}

.copy{
    background:#168c45;
    color:white;
}

.whatsapp{
    background:#25D366;
    color:white;
}

.message{
    margin-top:15px;
    background:#f7f7f7;
    padding:12px;
    border-radius:10px;
    white-space:pre-line;
    font-size:15px;
}

.warning{
    color:#c62828;
    font-weight:bold;
    margin-top:10px;
}
</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>BAJAJ EMI CALCULATOR</h1>
</div>

<div class="card">

<label>SHOP AMOUNT</label>

<input
    type="number"
    id="amount"
    placeholder="Enter Shop Amount"
    oninput="calculate()"
>


<label>CUSTOMER TYPE</label>

<select id="customer" onchange="calculate()">
    <option value="CARD CUSTOMER">CARD CUSTOMER</option>
    <option value="NEW CUSTOMER">NEW CUSTOMER</option>
</select>


<label>SCHEME</label>

<select id="scheme" onchange="calculate()">

    <option value="7/1">7/1</option>
    <option value="8/0" selected>8/0</option>
    <option value="10/2">10/2</option>
    <option value="15/3">15/3</option>
    <option value="12/4">12/4</option>
    <option value="18/6">18/6</option>
    <option value="24/4">24/4</option>
    <option value="20/2">20/2</option>
    <option value="18/4">18/4</option>
    <option value="10/0">10/0</option>
    <option value="12/1">12/1</option>

</select>


<label>INSURANCE</label>

<select id="insurance" onchange="calculate()">

    <option value="0">NO INSURANCE - ₹0</option>
    <option value="999">₹999</option>
    <option value="2051" selected>₹2,051</option>
    <option value="3077">₹3,077</option>
    <option value="4872">₹4,872</option>
    <option value="8207">₹8,207</option>
    <option value="10261">₹10,261</option>

</select>


<div id="warning" class="warning"></div>


<div class="result">

<div class="row">
<span>Product Amount</span>
<span class="value" id="product">₹0</span>
</div>

<div class="row">
<span>Process Amount</span>
<span class="value" id="process">₹0</span>
</div>

<div class="row">
<span>DBD + GST</span>
<span class="value" id="dbd">₹0</span>
</div>

<div class="row">
<span>DP</span>
<span class="value" id="dp">₹0</span>
</div>

<div class="row">
<span>Disbursement</span>
<span class="value" id="disbursement">₹0</span>
</div>

<div class="row">
<span>Insurance</span>
<span class="value" id="insuranceValue">₹0</span>
</div>

</div>


<div class="final">

<div>FINAL EMI</div>

<div class="emi" id="finalEmi">
₹0
</div>

<div id="months">
× 0 Months
</div>

<div class="info" id="insuranceInfo"></div>

</div>


<button
class="copy"
onclick="copyMessage()"
>
COPY EMI QUOTATION
</button>


<button
class="whatsapp"
onclick="sendWhatsApp()"
>
SEND ON WHATSAPP
</button>


<div
class="message"
id="message"
></div>

</div>
</div>


<script>

/* =========================
   SCHEMES
========================= */

const schemes = {

"7/1":{
    dbd:0.035,
    roi:0.057,
    adv:1,
    tenure:7,
    min:14500
},

"8/0":{
    dbd:0.03,
    roi:0.112,
    adv:0,
    tenure:8,
    min:12700
},

"10/2":{
    dbd:0.02,
    roi:0.0753,
    adv:2,
    tenure:10,
    min:17200
},

"15/3":{
    dbd:0.03,
    roi:0.0713,
    adv:3,
    tenure:15,
    min:12200
},

"12/4":{
    dbd:0.02,
    roi:0.048,
    adv:4,
    tenure:12,
    min:19500
},

"18/6":{
    dbd:0.02,
    roi:0.0525,
    adv:6,
    tenure:18,
    min:16100
},

"24/4":{
    dbd:0.02,
    roi:0.093,
    adv:4,
    tenure:24,
    min:12000
},

"20/2":{
    dbd:0.02,
    roi:0.1105,
    adv:2,
    tenure:20,
    min:12000
},

"18/4":{
    dbd:0.02,
    roi:0.077,
    adv:4,
    tenure:18,
    min:13300
},

"10/0":{
    dbd:0.05,
    roi:0.0918,
    adv:0,
    tenure:10,
    min:12000
},

    dbd:0.03,
    roi:0.098,
    adv:1,
    tenure:12,
    min:12000
}

};


/* =========================
   MONEY
========================= */

function money(n){

return "₹" +
Math.round(n).toLocaleString("en-IN");

}


/* =========================
   CALCULATE
========================= */

function calculate(){

let amount =
Number(document.getElementById("amount").value) || 0;

let customer =
document.getElementById("customer").value;

let schemeName =
document.getElementById("scheme").value;

let insurance =
Number(document.getElementById("insurance").value) || 0;

let s =
schemes[schemeName];

let warning =
document.getElementById("warning");


/* RESET */

if(amount <= 0){

warning.innerText="";

document.getElementById("product").innerText="₹0";
document.getElementById("process").innerText="₹0";
document.getElementById("dbd").innerText="₹0";
document.getElementById("dp").innerText="₹0";
document.getElementById("disbursement").innerText="₹0";
document.getElementById("insuranceValue").innerText="₹0";
document.getElementById("finalEmi").innerText="₹0";
document.getElementById("months").innerText="× 0 Months";
document.getElementById("insuranceInfo").innerText="";
document.getElementById("message").innerText="";

return;

}


/* MINIMUM LOAN */

if(amount < s.min){

warning.innerText =
"Minimum loan amount for " +
schemeName +
" is " +
money(s.min);

}else{

warning.innerText="";

}


/* =========================
   PROCESS AMOUNT
========================= */

let process =
Math.round(
amount /
(
1 -
s.dbd -
(s.dbd * 0.18)
)
);


/* =========================
   DBD
========================= */

let dbd =
Math.round(process * s.dbd);


/* =========================
   GST
========================= */

let gst =
Math.round(dbd * 0.18);

let totalDbdGst =
dbd + gst;


/* =========================
   BASE EMI
========================= */

let baseEmi =
Math.round(
process / s.tenure +
(
process *
s.roi /
12
)
);


/* =========================
   DP
========================= */

let dp;

if(s.adv === 0){

if(customer === "NEW CUSTOMER"){

dp=1417;

}else{

dp=837;

}

}else{

dp =
Math.round(
s.adv *
baseEmi +
567
);

}


/* =========================
   DISBURSEMENT
========================= */

let disbursement =
Math.round(
process -
totalDbdGst -
dp
);


/* =========================
   PAY EMI
========================= */

let payEmi =
s.tenure -
s.adv;


/* =========================
   INSURANCE
========================= */

let insurancePerEmi=0;

if(insurance > 0){

insurancePerEmi =
insurance /
payEmi;

}


/* =========================
   FINAL EMI
